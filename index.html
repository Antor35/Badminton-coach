function pl(){return"";return`<div class="pl">${P.map((n,i)=>`<button class="${V.p==i?"on":""}" onclick="V.p=${i};render()">${n}</button>`).join("")}</div>`}
/* ===== VIEWS ===== */
function dash(){const n=nextS(V.p),tot=36;return`<h1>Dashboard</h1><div class="c"><div class="row"><b class="grow">Active: ${P[V.p]}</b><button class="g" onclick="go('pf')">Profiles & backup</button></div>${pl()}</div>
<div class="c k-t"><b>Current phase:</b> ${n?(n[0]<=4?"1 – Foundations":n[0]<=8?"2 – Kinetic chain":"3 – Tactical"):"Complete"}<br>${n?`<b>Next:</b> Week ${n[0]} · Session ${n[1]+1}: ${W[n[0]-1][1][n[1]][0]}<div class="row"><button onclick="go('prog',{w:${n[0]},s:${n[1]},e:null,sv:1})">Open session</button><button class="g" onclick="go('rd')">Readiness check</button></div>`:"All sessions done!"}</div>
<div class="c"><b>Program progress</b><div class="mu">${nSess(0)}/${tot} sessions</div>${bar(nSess(0),tot)}</div>
<h2>Your stats</h2><p class="mu">Accuracy is calculated from the successes and attempts you log.</p>
${cmp("Low serve accuracy",acc("serve",0),acc("serve",1),100,"%")}${cmp("Overhead clear accuracy",acc("clear",0),acc("clear",1),100,"%")}${cmp("Best six-corner touches",best(0),best(1),20)}${cmp("Avg technique score",tech(0),tech(1),10)}`}
function prog(){if(V.sv)return sessView();return`<h1>Training Program</h1><div class="row">${W.map((w,i)=>`<button class="${V.w==i+1?"":"g"}" onclick="V.w=${i+1};render()">${i+1}</button>`).join("")}</div>
<h2>Week ${V.w}: ${W[V.w-1][0]}</h2>${W[V.w-1][1].map((s,i)=>`<div class="c k-t"><h3>Session ${i+1}: ${s[0]}</h3><div class="mu">${dur(V.w)} min · ${s[1].length} activities</div>${[0].map(p=>`<span class="tag">${P[p]} ${sDone(V.w,i,p)?"✔ done":"–"}</span> `).join("")}<div class="row"><button onclick="go('prog',{s:${i},sv:1})">Open</button></div></div>`).join("")}`}
function sessView(){const ss=sess(V.w,V.s);return`<button class="g" onclick="V.sv=0;render()">← Week ${V.w}</button><h1>W${V.w} · S${V.s+1}: ${W[V.w-1][1][V.s][0]}</h1>${pl()}
${V.w==4&&V.s==1||V.w==8&&V.s==1||V.w==12&&V.s==1?`<div class="c k-w">This session includes the formal evaluation. Record scores in the Assessments tab.</div>`:""}
<div class="c"><b>Timeline</b> (${dur(V.w)} min)<div class="bar" style="margin:6px 0"><i style="width:${100*ss.filter(e=>L(V.w,V.s,e,V.p).done).length/ss.length}%"></i></div>
${ss.map((e,i)=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--ln)"><span class="grow"><b>${i+1}. ${E[e].n}</b><br><span class="mu">${E[e].time}</span></span><span>${L(V.w,V.s,e,V.p).done?"✔":""}</span><button onclick="openEx('${e}')">Open</button></div>`).join("")}</div>
<button class="g" onclick="go('rd')">Do readiness check first</button>`}
function openEx(e){V.e=e;const x=E[e];if(!T.r)tset(x.work||0,"Work");go(V.t,{e})}
function exView(){const x=E[V.e],ctx=V.w&&V.sv&&V.t=="prog",l=ctx?L(V.w,V.s,V.e,V.p):{},ck=l.ck||[];
return`<button class="g" onclick="${ctx?"V.e=null":"V.e=null"};render()">← Back</button><h1>${x.n}</h1><div class="row"><span class="tag k-${x.c}">${CAT[x.c]}</span><span class="tag">${x.lv}</span><span class="tag">${x.time}</span><span class="tag">${x.eq}</span></div>
<p><b>What:</b> ${x.what}<br><b>Why:</b> ${x.why}${x.tg?`<br><b>Target:</b> ${x.tg}`:""}</p>
${x.pts?`<div class="row">${ct(x.pts)}<span class="mu grow">Green dots show target positions (your half is the bottom for movement, far half for hits).</span></div>`:""}
${x.sf?`<div class="c k-w"><b>Safety:</b> ${x.sf}</div>`:""}
<h2>Step by step</h2>${x.st.map((s,i)=>ctx?`<label class="ck"><input type="checkbox" ${ck[i]?"checked":""} onchange="chk(${i},this.checked)"><span><b>${i+1}.</b> ${s}</span></label>`:`<div class="st"><b>${i+1}</b><span>${s}</span></div>`).join("")}
<div class="c"><b>Common mistakes:</b> ${x.mi}<br><b>You’re doing it right when:</b> ${x.ok}</div>
<div class="c k-r"><b>Partner roles:</b> ${x.pt}</div>
${(VID[V.e]||[]).map(v=>`<div><a href="${v[1]}" target="_blank" rel="noopener">▶ ${v[0]}</a></div>`).join("")}<div class="row"><a href="${YT+encodeURIComponent(x.q)}" target="_blank" rel="noopener"><button class="g">▶ Search YouTube demos</button></a><button class="g" onclick="go('lib')">Terms</button></div><p class="mu">Links above are real pages or playlists found in search results (they open in a new tab). The grey button is only a YouTube search. None are reviewed by a coach.</p>${myv(V.e)}
${ctx?runner(x,l):""}`}
function runner(x,l){const done=l.sets||0;return`<h2>Run it · you work, your partner feeds</h2><div class="c"><div class="mu">Set ${Math.min(done+1,x.sets)} of ${x.sets}${x.reps?` · ${x.reps} reps`:""}</div>${bar(done,x.sets)}<div class="tm" id="tm"></div>
<div class="row"><button class="grow" id="tb" onclick="ttog()"></button><button class="g" onclick="tset(${x.work||0},'Work')">Reset</button><button class="grow" onclick="setDone()">Set done → rest ${x.rest}s</button></div>${done>=x.sets?`<p class="ok">All sets done. Log below, then swap roles.</p>`:`<p class="mu">After this set, swap roles.</p>`}</div>
<div class="c"><b>Log (${P[V.p]})</b><div class="row">${[["succ","Successes",99],["att","Attempts",99],["tech","Technique 1–10",10],["feed","Feeder quality 1–10",10],["diff","Difficulty 1–5",5],["pain","Pain 0–10",10]].map(f=>`<label class="mu">${f[1]}<br><input type="number" min="0" max="${f[2]}" value="${l[f[0]]??""}" onchange="setL('${f[0]}',this.value)"></label>`).join("")}</div>
<textarea rows="2" placeholder="Notes" onchange="setL('note',this.value)">${l.note||""}</textarea><div class="row"><button onclick="setL('done',true,1)">Mark activity complete</button></div></div>`}
function setL(k,v,r){const key=K(V.w,V.s,V.e,V.p);S.log[key]=S.log[key]||{};S.log[key][k]=v;sv();if(r)render()}
function chk(i,v){const key=K(V.w,V.s,V.e,V.p);S.log[key]=S.log[key]||{};(S.log[key].ck=S.log[key].ck||[])[i]=v;sv()}
function setDone(){const x=E[V.e];setL("sets",(L(V.w,V.s,V.e,V.p).sets||0)+1);if(x.rest){tset(x.rest,"Rest");ttog()}render()}
function lib(){const gr=Object.keys(CAT).map(c=>`<h2>${CAT[c]}</h2>`+Object.keys(E).filter(e=>E[e].c==c).map(e=>`<div class="c k-${c}"><div class="row"><b class="grow">${E[e].n}</b><button class="g" onclick="V.sv=0;openEx('${e}')">Open</button></div></div>`).join("")).join("");
return`<h1>Library</h1>${gr}<h2>Readiness checks</h2><button class="g" onclick="go('rd')">Open daily readiness check</button><h2>Terms</h2><div class="c">${GL.map(g=>`<details><summary>${g[0]}</summary>${g[1]}</details>`).join("")}</div><p class="mu">Not yet included: embedded videos, photo sequences, correct vs incorrect images.</p>`}
function rd(){const d=new Date().toISOString().slice(0,10),k=d+"|"+V.p,r=S.rd[k]||{v:{},o:7};const mx=Math.max(...Object.values(r.v).map(Number),0);
const adv=mx>=7?`<span class="bad">Stop and rest. If pain is sharp, swelling, numbness or lasting, consult a qualified professional.</span>`:mx>=4?`<span class="mid">Reduce intensity; skip exercises that load the sore area.</span>`:`<span class="ok">No major flags. Train sensibly.</span>`;
return`<h1>Daily readiness</h1>${pl()}<p class="mu">Each player does this separately. This is self-awareness, not medical clearance. Stop any test that hurts.</p>${RD.map((x,i)=>`<div class="c k-w"><b>${x[0]}</b><div class="mu">${x[1]} <a href="${YT+encodeURIComponent(x[2])}" target="_blank" rel="noopener">Demo search</a></div><input type="number" min="0" max="10" placeholder="0–10" value="${r.v[i]??""}" onchange="rdSet('${k}',${i},this.value)"> <span class="mu">0 = none, 4–6 = reduce, 7+ = stop</span></div>`).join("")}
<div class="c"><b>Overall readiness 1–10</b> <input type="number" min="1" max="10" value="${r.o}" onchange="rdO('${k}',this.value)"><p>${adv}</p><p class="mu">Below 6: cut volume to about 60% and skip jumps.</p></div>`}
function rdSet(k,i,v){S.rd[k]=S.rd[k]||{v:{},o:7};S.rd[k].v[i]=v;sv();render()}
function rdO(k,v){S.rd[k]=S.rd[k]||{v:{},o:7};S.rd[k].o=v;sv()}
function track(){const w=V.rw,rv=[0].map(p=>{const ex=[...new Set([0,1,2].flatMap(s=>sess(w,s)))].filter(e=>e!="wu"&&e!="cd");const weak=ex.filter(e=>{let a=[],pn=0;[0,1,2].forEach(s=>{const l=L(w,s,e,p);l.tech&&a.push(+l.tech);pn=Math.max(pn,+l.pain||0)});return a.length&&(a.reduce((x,y)=>x+y)/a.length<6||pn>=4)});const d=[0,1,2].filter(s=>sDone(w,s,p)).length;return{d,weak}});
return`<h1>Progress</h1><div class="row">${[0].map(p=>`<span class="tag">${P[p]}: ${nSess(p)} sessions · ${(()=>{let m=0;for(let a=1;a<=12;a++)for(let s=0;s<3;s++)sDone(a,s,p)&&(m+=dur(a));return(m/60).toFixed(1)})()} h</span>`).join("")}</div>
${cmp("Serve accuracy",acc("serve",0),acc("serve",1),100,"%")}${cmp("Net accuracy",acc("net",0),acc("net",1),100,"%")}${cmp("Clear accuracy",acc("clear",0),acc("clear",1),100,"%")}${cmp("Smash accuracy",acc("smash",0),acc("smash",1),100,"%")}${cmp("Best footwork touches",best(0),best(1),20)}${cmp("Avg technique",tech(0),tech(1),10)}
<h2>Weekly review</h2><select onchange="V.rw=+this.value;render()">${W.map((x,i)=>`<option value="${i+1}" ${w==i+1?"selected":""}>Week ${i+1}</option>`).join("")}</select>
${rv.map((r,i)=>`<div class="c"><b>${P[i]}</b>: ${r.d}/3 sessions done.<br>${r.weak.length?`Practise more: ${r.weak.map(e=>E[e].n).join(", ")}.`:"No weak spots logged."}<br><b>${r.d==3&&!r.weak.length?"Ready for next week.":"Repeat unfinished or weak items before advancing."}</b></div>`).join("")}`}
function asm(){const wi=[4,8,12].indexOf(V.aw);return`<h1>Assessments</h1><div class="row">${[4,8,12].map(w=>`<button class="${V.aw==w?"":"g"}" onclick="V.aw=${w};render()">Week ${w}</button>`).join("")}</div><p class="mu">Do the test in the matching session. Passing is guided by skill and safety, not by weeks.</p>
${AS.map(a=>{const t=a[3][wi];return`<div class="c k-t"><b>${a[1]}</b><div class="mu">Target: ${t==null?"not assessed":">= "+t+(a[2]=="%"?"%":" touches")}</div>${[0].map(p=>{const k=V.aw+"."+p+"."+a[0],v=S.as[k],st=t==null||v==null||v===""?"Not assessed":+v>=t?"Pass":"Needs improvement";return`<div class="row"><span>${P[p]}</span><input type="number" value="${v??""}" onchange="S.as['${k}']=this.value;sv();render()"><span class="${st=="Pass"?"ok":st=="Not assessed"?"mu":"mid"}">${st}</span></div>`}).join("")}<div class="mu">Trend: ${[0].map(p=>P[p]+" "+[4,8,12].map(w=>S.as[w+"."+p+"."+a[0]]||"–").join(" → ")).join(" · ")}</div></div>`}).join("")}`}
function notes(){return`<h1>Notes & plan review</h1>${pl()}<textarea id="nt" rows="3" placeholder="Observation, difficulty, goal…"></textarea><button onclick="if($('nt').value){S.nt.unshift({p:V.p,d:new Date().toLocaleDateString(),t:$('nt').value});sv();render()}">Save note</button>${S.nt.map(n=>`<div class="c"><span class="mu">${P[n.p]} · ${n.d}</span><br>${n.t}</div>`).join("")}
<h2>Review of the original plan</h2>${REVIEW.map(r=>`<div class="c ${r[1]=="Added"?"k-r":"k-w"}"><span class="tag">${r[1]}</span> <b>${r[0]}</b><br>${r[2]}</div>`).join("")}
<div class="c"><b>Prototype limits:</b> data is saved only in this browser on this device. A change on one phone never appears on the other. Use one shared phone, or move data with Profiles & backup. Not yet included: user accounts, embedded videos, images.</div>`}
const sel=(p,k,l,o)=>`<select aria-label="${l}" onchange="pfSet(${p},'${k}',this.value)"><option value="">${l}</option>${o.map(x=>`<option ${S.pf[p][k]==x?"selected":""}>${x}</option>`).join("")}</select>`;
function pfSet(p,k,v){S.pf[p][k]=k=="name"?v.replace(/[<>&"]/g,"").trim():v;sp();sv();render()}
const esc=s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
function myv(e){const a=S.vd[e]||[];return`<div class="c k-r"><b>My videos for this exercise</b>${a.map((v,i)=>`<div class="row"><a class="grow" href="${esc(v.u)}" target="_blank" rel="noopener">▶ ${esc(v.t)}</a><button class="g" onclick="vdDel('${e}',${i})">Remove</button></div>`).join("")||'<p class="mu">Nothing saved yet.</p>'}<input id="vt" style="width:100%;margin:6px 0" placeholder="Title (optional)"><input id="vu" style="width:100%" placeholder="Paste video link (https://...)"><div class="row"><button onclick="vdAdd('${e}')">Add video</button></div><p class="mu" id="vm"></p></div>`}
function vdAdd(e){const t=$("vt").value.trim(),u=$("vu").value.trim();if(!/^https?:\/\//i.test(u)){$("vm").textContent="Paste a full link starting with https://";return}(S.vd[e]=S.vd[e]||[]).push({t:t||u,u});sv();render()}
function vdDel(e,i){S.vd[e].splice(i,1);sv();render()}
function bkShow(){$("bk").value=JSON.stringify(S)}
function bkLoad(){try{const o=JSON.parse($("bk").value);if(!o.log||!o.pf)throw 0;S=o;["rd","as"].forEach(k=>S[k]=S[k]||{});S.nt=S.nt||[];S.vd=S.vd||{};sp();sv();render()}catch(e){$("bkm").textContent="Not a valid backup."}}
function prof(){const ok=S.pf[0].name;return`<h1>${ok?"Profiles & backup":"Welcome: enter your name"}</h1><p class="mu">Only the name is required. Everything else is optional and stays on this device.</p>${[0].map(p=>{const f=S.pf[p];return`<div class="c"><b>Your profile</b><input style="width:100%;margin:6px 0" placeholder="Name (required)" value="${f.name||""}" onchange="pfSet(${p},'name',this.value)"><div class="row">${sel(p,"lv","Experience",["Never played","Casual","Club level"])}${sel(p,"fit","Fitness level",["Low","Moderate","High"])}${sel(p,"hand","Playing hand",["Right","Left"])}</div><input style="width:100%;margin:6px 0" placeholder="Goal (optional)" value="${f.goal||""}" onchange="pfSet(${p},'goal',this.value)"><input style="width:100%" placeholder="Injuries or limits (optional)" value="${f.lim||""}" onchange="pfSet(${p},'lim',this.value)"></div>`}).join("")}${ok?`<button onclick="go('dash')">Start training</button>`:`<p class="mu">Enter your name to continue.</p>`}<h2>Backup & move data</h2><p class="mu">Each device keeps its own data. To move progress to another phone, tap Show backup text, copy it, then paste it there and tap Restore.</p><textarea id="bk" rows="3"></textarea><div class="row"><button class="g" onclick="bkShow()">Show backup text</button><button class="g" onclick="bkLoad()">Restore from text</button></div><p class="mu" id="bkm"></p>`}
const TABS=[["dash","🏠","Home",dash],["prog","📅","Program",prog],["lib","📚","Library",lib],["track","📈","Progress",track],["asm","✅","Tests",asm],["notes","📝","Notes",notes],["rd","","",rd],["pf","","",prof]];
function render(){$("nav").innerHTML=TABS.slice(0,6).map(t=>`<button class="${V.t==t[0]?"on":""}" onclick="V.e=null;V.sv=0;go('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join("");
$("app").innerHTML=!S.pf[0].name?prof():V.e?exView():TABS.find(t=>t[0]==V.t)[3]();sv();tdraw()}
render();
</script></body></html>
